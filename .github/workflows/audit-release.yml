name: Refresh uploaded release
on:
  release:
    types: [published, edited]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (blank means latest published release)
        type: string
      force:
        description: Rescan even when the recorded hashes already match
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: uploaded-release-refresh
  cancel-in-progress: false
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time installer compiler
        run: .\scripts\Install-InnoCompiler.ps1
      - name: Repackage changed upload and refresh reports
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TARGET_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          FORCE_RESCAN: ${{ inputs.force }}
        run: |
          .\scripts\Refresh-Release.ps1 -Tag $env:TARGET_TAG -Repository $env:GITHUB_REPOSITORY -Force:($env:FORCE_RESCAN -eq 'true')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-release-reports
          path: dist/
