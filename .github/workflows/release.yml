name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag, e.g. v1.2.0
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check version and source
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a tag such as v1.2.0' }
          cargo test --locked
          if ($LASTEXITCODE) { throw 'Tests failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Tooling tests failed' }
          .\scripts\Test-Scripts.ps1
      - name: Install build-time installer compiler
        run: .\scripts\Install-InnoCompiler.ps1
      - name: Build app and installer
        run: |
          .\scripts\Build-Installer.ps1
          if ((Get-Item dist\TrayLuma.exe).VersionInfo.ProductVersion -ne $env:RELEASE_TAG.Substring(1)) { throw 'Tag and product versions differ' }
      - name: Demo benchmark
        run: .\scripts\Benchmark.ps1 -ExePath .\dist\TrayLuma.exe -Demo -IdleSeconds 10 -Cycles 20 -Launches 5 -OutputDirectory .\dist\benchmark-demo
      - name: Microsoft Defender (no remediation)
        run: .\scripts\Scan-Defender.ps1 -Files dist\TrayLuma.exe,dist\TrayLuma-Setup.exe -OutputDirectory dist\security
      - name: Hashes and opt-in VirusTotal reports
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          python scripts/release_report.py dist/TrayLuma.exe dist/TrayLuma-Setup.exe --output dist --defender dist/security/defender.json --tag "$env:RELEASE_TAG" --repository "$env:GITHUB_REPOSITORY" --upload-virustotal
          if ($LASTEXITCODE) { throw 'A scan reported detections; review reports before publishing' }
      - name: Generate package-manager submissions
        run: |
          .\scripts\New-PackageManifests.ps1 -Version $env:RELEASE_TAG.Substring(1) -InstallerPath dist\TrayLuma-Setup.exe -Repository $env:GITHUB_REPOSITORY
          Compress-Archive -Path dist\benchmark-demo,dist\security -DestinationPath dist\verification-details.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrayLuma-release-and-reports
          path: dist/
      - name: Publish release (never silently replace an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/TrayLuma.exe dist/TrayLuma-Setup.exe dist/SHA256SUMS.txt dist/release-report.json dist/security-report.md dist/package-manifests.zip dist/verification-details.zip --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "TrayLuma $env:RELEASE_TAG" --notes-file dist/security-report.md
          if ($LASTEXITCODE) { throw 'Release creation failed; existing releases are not overwritten' }
